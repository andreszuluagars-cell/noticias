name: Publicar app en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Actualizar noticias diarias"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Preparar Pages
        uses: actions/configure-pages@v6

      - name: Subir carpeta web/ como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: "web"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
