name: Actualizar noticias diarias

on:
  schedule:
    # 10:30 UTC = 05:30 a.m. hora de Colombia (UTC-5)
    - cron: "30 10 * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/scraper.py

      - name: Publicar cambios si hay noticias nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias, no se hace commit."
          else
            git commit -m "Actualización automática de noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
